<div style="width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #FBF4E9 0%, #F8E2C6 62%, #E7C2A6 100%); font-family: Inter, sans-serif; color: #2B1A1C; display: flex; flex-direction: column;">
  <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0;">
    <a href="30-sankalpam-mine.html" style="display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px; text-decoration: none; color: #2B1A1C; font: 500 16px Inter, sans-serif;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2B1A1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Back</a>

  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
    <div role="tablist" aria-label="Practice mode" style="height: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFDF8; border-radius: 14px; border: 1px solid #E6D6BF; padding: 3px; box-sizing: border-box;">
      <a href="32-practise-read.html" role="tab" style="display: flex; align-items: center; justify-content: center; text-decoration: none; font: 500 16px Inter, sans-serif; color: #6B5559; border-radius: 11px;">Read</a>

      <span role="tab" aria-selected="true" style="display: flex; align-items: center; justify-content: center; font: 600 16px Inter, sans-serif; color: #FBF4E9; background: #3E6A33; border-radius: 11px;">Count</span>
    </div>
    <button type="button" style="align-self: flex-start; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #B7CDA8; background: #E3EEDB; font: 500 15px Inter, sans-serif; color: #2F4F27;">Counts for: me + 1,00,000 sankalpam ▾</button>
    <p style="margin: 6px 0 0; text-align: center; font: 500 30px/38px 'Cormorant Garamond', serif;">oṃ gaṃ gaṇapataye namaḥ</p>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;">
    <button type="button" aria-label="Count one" style="width: 236px; height: 236px; border-radius: 999px; border: 0; background: #FFFDF8; box-shadow: 0 10px 30px rgba(74,28,34,0.12); position: relative; padding: 0; cursor: pointer;">
      <svg width="236" height="236" viewBox="0 0 236 236" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
        <circle cx="118" cy="118" r="104" fill="none" stroke="#EFE3D1" stroke-width="6"></circle>
        <circle cx="118" cy="118" r="104" fill="none" stroke="#C79A3E" stroke-width="6" stroke-linecap="round" stroke-dasharray="653.45" transform="rotate(-90 118 118)" style="stroke-dashoffset: 326.73px;"></circle>
      </svg>
      <span style="position: relative; display: flex; flex-direction: column; align-items: center;">
        <span style="font: 600 56px/60px Inter, sans-serif; color: #2B1A1C;">54</span>
        <span style="font: 500 15px/20px Inter, sans-serif; color: #6B5559;">of 108 · round 1</span>
      </span>
    </button>
    <div style="font: 400 15px/20px Inter, sans-serif; color: #4A2E32;">Tap anywhere on the circle</div>
  </div>

  <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 0 16px 24px; flex-shrink: 0;">

    <a href="30-sankalpam-mine.html" style="height: 56px; border-radius: 16px; background: #3E6A33; color: #FBF4E9; font: 600 17px/56px Inter, sans-serif; text-align: center; text-decoration: none;">Finish and save</a>
