<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New sankalpam</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0}
a{color:#1B3A4B}a:hover{color:#7A1F2B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FBF4E9; font-family: Inter, sans-serif; color: #2B1A1C; display: flex; flex-direction: column;">
  <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid rgba(199,154,62,0.5); flex-shrink: 0;">
    <a href="30-sankalpam-mine.html" style="display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px; text-decoration: none; color: #2B1A1C; font: 500 16px Inter, sans-serif;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2B1A1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Back</a>
    <div style="font: 600 22px 'Cormorant Garamond', serif;">New sankalpam</div>
    <a href="03-home.html" style="display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px; text-decoration: none; color: #2B1A1C; font: 500 16px Inter, sans-serif;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#2B1A1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Home</a>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <div style="font: 600 15px Inter, sans-serif; margin-bottom: 8px;">What will you chant?</div>
      <button type="button" style="width: 100%; height: 64px; border-radius: 16px; border: 1px solid #B7CDA8; background: #E3EEDB; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font: 600 20px 'Cormorant Garamond', serif; color: #2B1A1C;">Gaṇeśa mūla mantra <span style="font: 500 15px Inter, sans-serif; color: #1B3A4B;">Change ›</span></button>
    </div>

    <div>
      <div style="font: 600 15px Inter, sans-serif; margin-bottom: 8px;">With whom?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" aria-pressed="true" style="height: 72px; border-radius: 16px; border: 2px solid #3E6A33; background: #FFFDF8; font: 600 17px Inter, sans-serif; color: #2F4F27;">Just me</button>
        <button type="button" disabled style="height: 72px; border-radius: 16px; border: 1px dashed #D8C9B4; background: transparent; font: 500 16px/20px Inter, sans-serif; color: #8A7478;">Start a group<br><span style="font-size: 13px;">coming soon</span></button>
      </div>
    </div>

    <div>
      <label for="target" style="display: block; font: 600 15px Inter, sans-serif; margin-bottom: 8px;">Total to reach <span style="font-weight: 400; color: #6B5559;">(optional)</span></label>
      <input id="target" type="text" inputmode="numeric" value="1,00,000" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 16px; border: 1px solid #D8C9B4; background: #FFFDF8; padding: 0 16px; font: 500 18px Inter, sans-serif; color: #2B1A1C;">
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #D8C9B4; background: transparent; font: 500 15px Inter, sans-serif; color: #2B1A1C;">1,008</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #D8C9B4; background: transparent; font: 500 15px Inter, sans-serif; color: #2B1A1C;">10,008</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #3E6A33; font: 500 15px Inter, sans-serif; color: #FBF4E9;">1,00,000</button>
      </div>
    </div>

    <div>
      <div style="font: 600 15px Inter, sans-serif; margin-bottom: 8px;">For how many days? <span style="font-weight: 400; color: #6B5559;">(optional)</span></div>
      <div style="display: flex; gap: 8px;">
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D8C9B4; background: transparent; font: 500 15px Inter, sans-serif; color: #2B1A1C;">11</button>
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D8C9B4; background: transparent; font: 500 15px Inter, sans-serif; color: #2B1A1C;">21</button>
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #3E6A33; font: 500 15px Inter, sans-serif; color: #FBF4E9;">41</button>
        <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D8C9B4; background: transparent; font: 500 15px Inter, sans-serif; color: #2B1A1C;">No end</button>
      </div>
    </div>

    <div>
      <label for="intent" style="display: block; font: 600 15px Inter, sans-serif; margin-bottom: 8px;">Your intent <span style="font-weight: 400; color: #6B5559;">(optional, only you see it)</span></label>
      <input id="intent" type="text" placeholder="For a peaceful home" style="width: 100%; height: 56px; box-sizing: border-box; border-radius: 16px; border: 1px solid #D8C9B4; background: #FFFDF8; padding: 0 16px; font: 400 17px Inter, sans-serif; color: #2B1A1C;">
    </div>

    <div style="flex: 1;"></div>
    <a href="30-sankalpam-mine.html" style="height: 56px; border-radius: 16px; background: #3E6A33; color: #FBF4E9; font: 600 17px/56px Inter, sans-serif; text-align: center; text-decoration: none;">Begin</a>
  </div>
</div>
</body>
</html>
