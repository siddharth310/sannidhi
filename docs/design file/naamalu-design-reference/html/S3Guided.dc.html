<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const names = [
      { te1: 'సుముఖాయ నమః', te2: 'మాచీపత్రం పూజయామి', iast: 'sumukhāya namaḥ · mācīpatraṁ pūjayāmi', leaf: 'māchī (or any leaf)' },
      { te1: 'గణాధిపాయ నమః', te2: 'బృహతీపత్రం పూజయామి', iast: 'gaṇādhipāya namaḥ · bṛhatīpatraṁ pūjayāmi', leaf: 'bṛhatī (or any leaf)' },
      { te1: 'ఉమాపుత్రాయ నమః', te2: 'బిల్వపత్రం పూజయామి', iast: 'umāputrāya namaḥ · bilvapatraṁ pūjayāmi', leaf: 'bilva (or any leaf)' }
    ];
    const i = this.state.i;
    return {
      name: names[i],
      counter: (i + 1) + ' OF 21',
      next: () => this.setState({ i: Math.min(i + 1, names.length - 1) }),
      prev: () => this.setState({ i: Math.max(i - 1, 0) })
    };
  }
}
</script>
