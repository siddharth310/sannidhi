<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v3 · Reader / Player (EN / हिं)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&amp;family=Noto+Serif+Devanagari:wght@500;700&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FBF4E9}
a{color:#1B3A4B}a:hover{color:#1B3A4B}

</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #FBF4E9; color: #2A1A14; font-family: {{ ui }}">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 250px; background: linear-gradient(180deg, #1B3A4B 0%, #2F7188 100%)"></div>
  <div style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 48px 16px 0">
    <a href="V3NaamaluEN.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(241,235,223,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F1EBDF" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="display: flex; border-radius: 22px; background: rgba(241,235,223,0.12); padding: 4px">
      <button onClick="{{ setRead }}" style="{{ tabRead }}">{{ t.read }}</button>
      <button onClick="{{ setListen }}" style="{{ tabListen }}">{{ t.listen }}</button>
    </div>
    <button onClick="{{ toggle }}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: rgba(241,235,223,0.12); font-family: {{ ui }}; font-size: 14px; font-weight: 600; color: #F1EBDF; cursor: pointer">{{ t.pill }}</button>
  </div>
  <div style="position: relative; padding: 20px 20px 0; color: #F1EBDF">
    <div style="font-family: {{ sacred }}; font-style: {{ sacredStyle }}; font-size: 25px; font-weight: 650; line-height: 1.3">{{ t.title }}</div>
    <div style="font-size: 14px; color: #B9D6DF; margin-top: 2px">{{ t.sub }}</div>
  </div>
  <div style="position: absolute; left: 0; top: 230px; width: 390px; height: 770px; background: #FBF4E9; border-radius: 30px 30px 0 0"></div>
  <div style="position: absolute; left: 20px; top: 248px; width: 350px">
    <div style="display: flex; border-radius: 22px; background: #DCEBEF; padding: 4px">
      <button onClick="{{ scIa }}" style="{{ pillIa }}">IAST</button>
      <button onClick="{{ scSa }}" style="{{ pillSa }}">संस्कृतम्</button>
    </div>
    <div style="display: flex; flex-direction: column; padding-top: 10px">
      <sc-for list="{{ names }}" as="n" hint-placeholder-count="8">
        <div style="{{ n.row }}">
          <div style="width: 30px; font-family: 'Fraunces', serif; font-size: 14px; color: #2F7188">{{ n.no }}</div>
          <div style="{{ n.text }}">{{ n.line }}</div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="{{ playerBar }}">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="font-family: 'Instrument Sans', sans-serif; font-size: 13px; color: #B9D6DF; width: 36px">0.75×</div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(241,235,223,0.2)"><div style="width: 4%; height: 4px; border-radius: 2px; background: #F4D39B"></div></div>
      <div style="width: 56px; height: 56px; border-radius: 28px; background: #F4D39B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1B3A4B"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></div>
    </div>
    <div style="font-size: 12px; color: #B9D6DF; margin-top: 8px">{{ t.counts }}</div>
  </div>
  <div style="{{ readBar }}">
    <div style="flex-grow: 1; font-size: 13px; color: #1B3A4B">{{ t.doneHint }}</div>
    <div style="height: 48px; padding: 0 18px; border-radius: 24px; background: #1B3A4B; color: #F1EBDF; display: flex; align-items: center; font-size: 14px; font-weight: 600">{{ t.done }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en', mode: 'listen', sc: null }; }

  langVals(S) {
    const hi = this.state.lang === 'hi';
    const t = {}; for (const k in S) t[k] = hi ? S[k][1] : S[k][0];
    return Object.assign({ t, hi,
      ui: hi ? "'Noto Sans Devanagari', sans-serif" : "'Instrument Sans', sans-serif",
      sacred: hi ? "'Noto Serif Devanagari', serif" : "'Fraunces', serif",
      sacredStyle: hi ? 'normal' : 'italic',
      toggle: () => this.setState({ lang: hi ? 'en' : 'hi' }) });
  }

  renderVals() {
    const S = {
      pill: ['English ▾', 'हिन्दी ▾'], read: ['Read', 'पढ़ें'], listen: ['Listen', 'सुनें'],
      title: ['Śrī Gaṇeśa Aṣṭottara Śatanāmāvaliḥ', 'श्री गणेश अष्टोत्तर शतनामावली'], sub: ['108 names · ~6 min', '108 नाम · ~6 मिनट'],
      counts: ['Counts when finished · our pārāyaṇam: Kārtika Lalitā', 'पूरा होने पर गिना जाएगा · हमारा पारायण: कार्तिक ललिता'],
      doneHint: ['Tap "Done" after the last name', 'अंतिम नाम के बाद "पूर्ण" दबाएँ'], done: ['Done', 'पूर्ण']
    };
    const L = this.langVals(S), hi = L.hi;
    const N = [['ॐ विनायकाय नमः','oṁ vināyakāya namaḥ'],['ॐ विघ्नराजाय नमः','oṁ vighnarājāya namaḥ'],['ॐ गौरीपुत्राय नमः','oṁ gaurīputrāya namaḥ'],['ॐ गणेश्वराय नमः','oṁ gaṇeśvarāya namaḥ'],
               ['ॐ स्कन्दाग्रजाय नमः','oṁ skandāgrajāya namaḥ'],['ॐ अव्ययाय नमः','oṁ avyayāya namaḥ'],['ॐ पूताय नमः','oṁ pūtāya namaḥ'],['ॐ दक्षाय नमः','oṁ dakṣāya namaḥ']];
    const sc = this.state.sc || (hi ? 'sa' : 'iast'), listen = this.state.mode === 'listen';
    const tab = on => 'height: 36px; padding: 0 16px; border-radius: 18px; border: none; font-family: ' + L.ui + '; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #F4D39B; color: #1B3A4B' : 'background: transparent; color: #DCEBEF');
    const pill = on => 'flex-grow: 1; height: 40px; border-radius: 20px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; ' + (on ? 'background: #1B3A4B; color: #F1EBDF' : 'background: transparent; color: #1B3A4B');
    L.names = N.map((n, i) => { const cur = listen && i === 3; return { no: i + 1, line: sc === 'sa' ? n[0] : n[1],
      row: 'display: flex; align-items: center; padding: 14px 12px; border-radius: 18px; ' + (cur ? 'background: #DCEBEF;' : 'border-bottom: 1px solid #EFE4D2;'),
      text: 'font-family: ' + (sc === 'sa' ? "'Noto Serif Devanagari', serif" : "'Fraunces', serif") + '; font-size: ' + (cur ? 23 : 20) + 'px; font-weight: ' + (cur ? 700 : 500) + '; ' + (sc === 'iast' ? 'font-style: italic; ' : '') + 'color: ' + (cur ? '#1B3A4B' : (listen && i < 3 ? '#9C8A7C' : '#2A1A14')) }; });
    Object.assign(L, { tabRead: tab(!listen), tabListen: tab(listen),
      setRead: () => this.setState({ mode: 'read' }), setListen: () => this.setState({ mode: 'listen' }),
      pillSa: pill(sc === 'sa'), pillIa: pill(sc === 'iast'),
      scSa: () => this.setState({ sc: 'sa' }), scIa: () => this.setState({ sc: 'iast' }),
      playerBar: listen ? 'position: absolute; left: 12px; right: 12px; bottom: 16px; border-radius: 28px; background: #1B3A4B; padding: 14px 18px; color: #F1EBDF' : 'display: none',
      readBar: listen ? 'display: none' : 'position: absolute; left: 12px; right: 12px; bottom: 16px; border-radius: 28px; background: #DCEBEF; padding: 12px 12px 12px 18px; display: flex; align-items: center; gap: 12px' });
    return L;
  }
}
</script>
</body>
</html>
